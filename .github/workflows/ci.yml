name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - name: Install oaklint from its private GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release download -R omaralikhn/oaklint-ts -p '*.tgz' --clobber
          npm install --no-save ./eslint-plugin-oaklint-*.tgz
          rm ./eslint-plugin-oaklint-*.tgz

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run build
      - run: npm run test:coverage
